name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Keep the toolchain version in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --manifest-path fixtures/rust/controller-service-provider/Cargo.toml
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  watcher-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Exercise Chakra's bounded polling selection and owned watcher lifecycle.
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test --locked -p chakra-language --lib
      - run: cargo test --locked -p chakra-language --test live_updates

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  support-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 tools/check_support_matrix.py --check
      # Hermetic corpus-fetcher retry tests; never touch the network.
      - run: python3 tools/test_fetch_corpus.py

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Keep the toolchain version in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.1
      # Scenario regression gate for every fixture language.
      - run: cargo test --locked -p chakra-conformance
      # The committed result files must match a fresh emission exactly.
      - run: |
          emitted="$(mktemp -d)"
          cargo run --locked -p chakra-conformance -- emit "$emitted"
          diff -r docs/support/conformance "$emitted"
      # Committed public-corpus artifacts must stay well-formed and
      # manifest-consistent. Structure only: measured values are never
      # diffed, and nothing is fetched from the network.
      - run: cargo run --locked -p chakra-conformance -- corpus --verify

  large-repository-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Build the shipped executable as well as the generated multi-language
      # release gate so debug-only behavior cannot satisfy this job.
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --locked --release --workspace
      - run: >-
          cargo test --locked --release -p chakra-mcp
          --test large_repository_gate
          generated_multi_language_release_gate
          -- --ignored --exact --nocapture
