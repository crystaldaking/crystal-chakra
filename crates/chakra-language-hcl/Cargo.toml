[package]
name = "chakra-language-hcl"
description = "Git-aware Tree-sitter HCL syntax index adapter for Chakra"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.2.0" }
chakra-engine = { path = "../chakra-engine", version = "0.2.0" }
chakra-git = { path = "../chakra-git", version = "0.2.0" }
chakra-language-index = { path = "../chakra-language-index", version = "0.2.0" }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-hcl.workspace = true
tree-sitter-json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
