[package]
name = "chakra-cli"
description = "User-facing chakra CLI and binary entry point"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chakra"
path = "src/main.rs"

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.2.0" }
chakra-engine = { path = "../chakra-engine", version = "0.2.0" }
chakra-language = { path = "../chakra-language", version = "0.2.0" }
chakra-mcp = { path = "../chakra-mcp", version = "0.2.0" }
chakra-provider-csharp-ls = { path = "../chakra-provider-csharp-ls", version = "0.2.0" }
chakra-provider-bash-language-server = { path = "../chakra-provider-bash-language-server", version = "0.2.0" }
chakra-provider-clangd = { path = "../chakra-provider-clangd", version = "0.2.0" }
chakra-provider-jdtls = { path = "../chakra-provider-jdtls", version = "0.2.0" }
chakra-provider-pool = { path = "../chakra-provider-pool", version = "0.2.0" }
chakra-provider-pyright = { path = "../chakra-provider-pyright", version = "0.2.0" }
chakra-provider-rust-analyzer = { path = "../chakra-provider-rust-analyzer", version = "0.2.0" }
chakra-provider-terraform-ls = { path = "../chakra-provider-terraform-ls", version = "0.2.0" }
chakra-provider-gopls = { path = "../chakra-provider-gopls", version = "0.2.0" }
chakra-provider-vtsls = { path = "../chakra-provider-vtsls", version = "0.2.0" }
chakra-workspace = { path = "../chakra-workspace", version = "0.2.0" }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
