[package]
name = "chakra-cli"
description = "User-facing chakra CLI and binary entry point"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chakra"
path = "src/main.rs"

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.1.0" }
chakra-engine = { path = "../chakra-engine", version = "0.1.0" }
chakra-git = { path = "../chakra-git", version = "0.1.0" }
chakra-language = { path = "../chakra-language", version = "0.1.0" }
chakra-mcp = { path = "../chakra-mcp", version = "0.1.0" }
chakra-provider-rust-analyzer = { path = "../chakra-provider-rust-analyzer", version = "0.1.0" }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
