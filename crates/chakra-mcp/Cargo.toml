[package]
name = "chakra-mcp"
description = "MCP adapter for Chakra query contracts (stdio transport)"
version = "0.3.0-beta.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.3.0-beta.1" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
chakra-engine = { path = "../chakra-engine", version = "0.3.0-beta.1" }
chakra-git = { path = "../chakra-git", version = "0.3.0-beta.1" }
chakra-language = { path = "../chakra-language", version = "0.3.0-beta.1" }
rmcp = { version = "3", default-features = false, features = ["client", "macros", "transport-async-rw"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
