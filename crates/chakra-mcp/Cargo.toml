[package]
name = "chakra-mcp"
description = "MCP adapter for Chakra query contracts (stdio transport)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.1.0" }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
chakra-engine = { path = "../chakra-engine", version = "0.1.0" }
chakra-git = { path = "../chakra-git", version = "0.1.0" }
chakra-language-rust = { path = "../chakra-language-rust", version = "0.1.0" }
rmcp = { version = "3", default-features = false, features = ["client", "macros", "transport-async-rw"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
