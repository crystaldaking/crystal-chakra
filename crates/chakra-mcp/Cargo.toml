[package]
name = "chakra-mcp"
description = "MCP adapter for Chakra query contracts (stdio transport)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.1.0" }
rmcp.workspace = true
thiserror.workspace = true

[dev-dependencies]
chakra-engine = { path = "../chakra-engine", version = "0.1.0" }
rmcp = { version = "3", default-features = false, features = ["client", "macros", "transport-async-rw"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

[lints]
workspace = true
