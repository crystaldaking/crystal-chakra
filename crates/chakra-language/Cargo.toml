[package]
name = "chakra-language"
description = "Multi-language syntax index composition and live reconciliation for Chakra"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.1.1" }
chakra-engine = { path = "../chakra-engine", version = "0.1.1" }
chakra-git = { path = "../chakra-git", version = "0.1.1" }
chakra-language-java = { path = "../chakra-language-java", version = "0.1.1" }
chakra-language-javascript = { path = "../chakra-language-javascript", version = "0.1.1" }
chakra-language-php = { path = "../chakra-language-php", version = "0.1.1" }
chakra-language-python = { path = "../chakra-language-python", version = "0.1.1" }
chakra-language-rust = { path = "../chakra-language-rust", version = "0.1.1" }
chakra-language-typescript = { path = "../chakra-language-typescript", version = "0.1.1" }
notify.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
