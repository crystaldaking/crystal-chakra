chakra-git = { path = "../chakra-git", version = "0.2.0" }
chakra-language-java = { path = "../chakra-language-java", version = "0.2.0" }
chakra-language-csharp = { path = "../chakra-language-csharp", version = "0.2.0" }
chakra-language-shell = { path = "../chakra-language-shell", version = "0.2.0" }
chakra-language-cpp = { path = "../chakra-language-cpp", version = "0.2.0" }
chakra-language-hcl = { path = "../chakra-language-hcl", version = "0.2.0" }
chakra-language-index = { path = "../chakra-language-index", version = "0.2.0" }
chakra-language-go = { path = "../chakra-language-go", version = "0.2.0" }
chakra-language-javascript = { path = "../chakra-language-javascript", version = "0.2.0" }
chakra-language-php = { path = "../chakra-language-php", version = "0.2.0" }
chakra-language-python = { path = "../chakra-language-python", version = "0.2.0" }
chakra-language-rust = { path = "../chakra-language-rust", version = "0.2.0" }
chakra-language-typescript = { path = "../chakra-language-typescript", version = "0.2.0" }
