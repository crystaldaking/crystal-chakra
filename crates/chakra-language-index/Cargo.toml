[package]
name = "chakra-language-index"
description = "Shared language-neutral syntax indexing scaffolding for Chakra language adapters"
version = "0.3.0-beta.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chakra-domain = { path = "../chakra-domain", version = "0.3.0-beta.1" }
chakra-engine = { path = "../chakra-engine", version = "0.3.0-beta.1" }
chakra-git = { path = "../chakra-git", version = "0.3.0-beta.1" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["resource"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
