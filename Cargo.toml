[workspace]
resolver = "3"
members = ["crates/*"]
# Fixture crates are standalone packages, not workspace members.
exclude = ["fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
arc-swap = "1"
regex = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "std"] }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
