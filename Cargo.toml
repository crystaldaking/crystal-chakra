[workspace]
resolver = "3"
members = ["crates/*"]
# Fixture crates are standalone packages, not workspace members.
exclude = ["fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/crystaldaking/crystal-chakra"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
arc-swap = "1"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
regex = "1"
rpds = "1.2"
notify = "8.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "std"] }
url = "2"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
